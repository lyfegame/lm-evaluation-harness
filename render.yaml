services:
  - type: web
    name: fundamental-eval
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: true
      - key: PRODUCTION
        value: true
    autoDeploy: true
    disk:
      name: lm-eval-cache
      mountPath: /opt/render/project/.cache
      sizeGB: 1